[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stockproof"
version = "0.4.1"
description = "LLM stock research with cited sources (news, earnings, filings), tested on 10 years of point-in-time data: quant lab, portfolio check-up, web dashboard, DeepSeek Harness / MCP plugin. US, China A-shares, HK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["stocks", "llm", "sentiment", "earnings", "a-shares", "deepseek", "deepseek-harness", "event-study", "backtesting", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]
# China markets (A-shares, Hong Kong). AKShare needs Python 3.11+
cn = ["akshare; python_version >= \"3.11\""]
# price download for `stockproof research --download`
research = ["yfinance"]
# `stockproof mcp`: tools for AI agents (MCP needs Python 3.10+)
mcp = ["mcp; python_version >= \"3.10\""]

[project.urls]
Homepage = "https://github.com/taoqizhang55-code/stockproof"
Issues = "https://github.com/taoqizhang55-code/stockproof/issues"

[project.scripts]
stockproof = "stockproof.cli:main"

[tool.setuptools.packages.find]
include = ["stockproof", "stockproof.*"]

[tool.setuptools.package-data]
stockproof = ["demo_data/*", "demo_data/**/*"]
