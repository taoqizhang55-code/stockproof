# stockproof MCP server for DeepSeek Harness.
# Needs stockproof installed for a Python 3.10+:  pip install "stockproof[mcp,cn]"
# Set before starting dsh (e.g. in ~/.zshrc):
#   STOCKPROOF_PYTHON  the python that has stockproof installed (default: python3)
#   STOCKPROOF_HOME    the folder with your stockproof_data (default: where dsh was started)
#   DEEPSEEK_API_KEY   used by the tools that read reports (DSH hides *KEY* variables from servers,
#                      so it is passed on explicitly below)
- insert:
    - id: stockproof-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: stockproof
        transport: stdio
        command: !!js process.env.STOCKPROOF_PYTHON ?? 'python3'
        args: ['-m', 'stockproof', 'mcp']
        cwd: !!js process.env.STOCKPROOF_HOME ?? process.cwd()
        env:
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY ?? ''
          STOCKPROOF_SEC_CONTACT: !!js process.env.STOCKPROOF_SEC_CONTACT ?? ''
